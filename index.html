<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مقاضي">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مقاضي</title>
<style>
  :root{
    --bg:#f6f3ec; --card:#fffdf8; --ink:#1f2a24; --soft:#7b857f; --line:#e7e1d4;
    --green:#1f7a5a; --green2:#e3f1ea; --done:#a9b0ab; --red:#c0533f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Geeza Pro",system-ui,sans-serif}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 90px}

  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px}
  .top{display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:11px}
  h1{margin:0;font-size:24px;font-weight:800;letter-spacing:0}
  .ver{font-size:12px;color:var(--soft);font-weight:600;margin-inline-start:8px}
  .sp{flex:1}
  .who{border:0;background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font:inherit;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:#bbb;transition:.3s}
  .dot.on{background:#2fb37a;box-shadow:0 0 0 3px #2fb37a22}

  .add{margin-top:12px;display:flex;gap:8px}
  .add input{flex:1;min-width:0;font:inherit;font-size:18px;padding:14px 16px;border-radius:16px;
    border:1.5px solid var(--line);background:var(--card);outline:none;color:var(--ink)}
  .add input:focus{border-color:var(--green)}
  .add button{border:0;background:var(--green);color:#fff;font:inherit;font-size:26px;line-height:1;
    width:56px;border-radius:16px;cursor:pointer}
  .add button:active{transform:scale(.96)}
  .sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:0}
  .chip{border:1px solid #cfe5d9;background:var(--green2);color:var(--green);font:inherit;font-size:15px;
    padding:7px 14px;border-radius:999px;cursor:pointer;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .list{margin-top:8px}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:13px 14px;margin-top:8px;cursor:pointer;user-select:none;
    transition:background .2s, transform .1s}
  .item:active{transform:scale(.99)}
  .item.flash{animation:flash 1s ease}
  @keyframes flash{0%,100%{background:var(--card)}30%{background:#fff3c9}}
  .item.new{animation:slide .35s ease}
  @keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .box{width:26px;height:26px;border-radius:50%;border:2px solid #c9c2b3;flex:none;display:grid;place-items:center}
  .box svg{width:15px;height:15px;opacity:0}
  .txt{flex:1;min-width:0}
  .name{font-size:18px;font-weight:600;overflow-wrap:anywhere}
  .meta{font-size:12px;color:var(--soft);margin-top:2px}
  .x{border:0;background:none;color:#c4bdae;font-size:22px;padding:2px 6px;cursor:pointer;line-height:1}
  .done .box{background:var(--green);border-color:var(--green)}
  .done .box svg{opacity:1}
  .done .name{color:var(--done);text-decoration:line-through;font-weight:500}
  .done{background:#faf8f3}

  .sec{display:flex;align-items:center;margin-top:26px;color:var(--soft);font-size:14px;font-weight:600}
  .sec .sp{flex:1}
  .clear{border:0;background:none;color:var(--red);font:inherit;font-size:14px;cursor:pointer;padding:4px}
  .empty{text-align:center;color:var(--soft);margin-top:60px;font-size:16px;line-height:1.9}
  .empty b{display:block;font-size:40px;margin-bottom:4px}

  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);
    background:#24302a;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;display:flex;gap:14px;
    align-items:center;transition:.25s;z-index:20;max-width:92vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast button{border:0;background:none;color:#8fe0b9;font:inherit;font-weight:700;cursor:pointer}

  .sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:30}
  .sheet.show{display:flex}
  .panel{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
  .panel h2{margin:0 0 6px;font-size:20px}
  .panel p{margin:0 0 14px;color:var(--soft);font-size:14px;line-height:1.7}
  .panel input{width:100%;font:inherit;font-size:18px;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);outline:none}
  .panel input:focus{border-color:var(--green)}
  .btn{margin-top:14px;width:100%;border:0;background:var(--green);color:#fff;font:inherit;font-size:17px;font-weight:700;padding:14px;border-radius:14px;cursor:pointer}
  .install{display:none;margin-top:12px;width:100%;border:1.5px dashed #b9d8c8;background:var(--green2);color:var(--green);
    font:inherit;font-size:15px;padding:11px;border-radius:14px;cursor:pointer}
  .hint{font-size:13px;color:var(--soft);margin-top:12px;line-height:1.7;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <img class="logo" src="icon-192.png" alt="">
      <h1>مقاضي<span class="ver">إصدار 1</span></h1>
      <div class="sp"></div>
      <button class="who" id="whoBtn"><span class="dot" id="dot"></span><span id="whoName">…</span></button>
    </div>
    <form class="add" id="addForm" autocomplete="off">
      <input id="inp" placeholder="أضف غرضاً…" enterkeyhint="done" autocomplete="off">
      <button type="submit" aria-label="إضافة">+</button>
    </form>
    <div class="sugg" id="sugg"></div>
    <button class="install" id="installBtn">⬇︎ ثبّت «مقاضي» على الجوال</button>
    <div class="hint" id="iosHint">للتثبيت على آيفون: اضغط زر المشاركة في سفاري ثم «إضافة إلى الشاشة الرئيسية».</div>
  </header>

  <div class="list" id="active"></div>
  <div id="doneWrap"></div>
</div>

<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn">تراجع</button></div>

<div class="sheet" id="nameSheet">
  <div class="panel">
    <h2>أهلاً بك في مقاضي</h2>
    <p>اكتب اسمك ليعرف أهل البيت من أضاف ومن اشترى.</p>
    <input id="nameInp" placeholder="مثلاً: أبو إلياس" maxlength="20">
    <button class="btn" id="nameSave">ابدأ</button>
  </div>
</div>

<script>
/* ===== الإعدادات ===== */
const VERSION = 1;
const CHANNEL = 'maqadi-7vekdux27zuq337amg';   // قناة العائلة الخاصة
const SERVER  = 'https://ntfy.sh';
const KEEP_DELETED_DAYS = 10;
const MIN_REPEAT = 2;          // لا يُقترح الغرض إلا إذا تكرر مرتين فأكثر
const MAX_SUGG = 4;

/* ===== الحالة ===== */
const KEY = 'maqadi.v1';
let S = load();
function load(){
  let s; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  s = s || {};
  s.items = s.items || {};      // id -> {id,n,s,t,d,a,b}
  s.counts = s.counts || {};    // normName -> {n,c}
  s.dev = s.dev || rid(8);
  s.me = s.me || '';
  s.last = s.last || 0;         // آخر وقت رسالة مستلمة (ثوانٍ)
  return s;
}
function save(){
  const cut = Date.now() - KEEP_DELETED_DAYS*864e5;
  for(const id in S.items){ const it=S.items[id]; if(it.d && it.t < cut) delete S.items[id]; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function rid(n){ const c='abcdefghijklmnopqrstuvwxyz0123456789'; let r=''; const a=crypto.getRandomValues(new Uint8Array(n)); for(const x of a) r+=c[x%36]; return r; }

/* توحيد الكتابة العربية للبحث والمقارنة */
function norm(s){
  return (s||'').replace(/[ً-ٰٟـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function bump(name){
  const k = norm(name); if(!k) return;
  const c = S.counts[k] || {n:name, c:0};
  c.c++; c.n = name.trim(); S.counts[k] = c;
}

/* دمج تغيير (من هذا الجهاز أو من غيره) — الأحدث يفوز */
function apply(it){
  const ex = S.items[it.id];
  if(!ex){
    if(it.t < Date.now() - KEEP_DELETED_DAYS*864e5) return null;
    S.items[it.id] = it;
    if(!it.d) bump(it.n);
    return it.d ? null : (it.s ? 'strike' : 'add');
  }
  if(it.t > ex.t || (it.t === ex.t && JSON.stringify(it) > JSON.stringify(ex))){
    S.items[it.id] = it;
    if(it.d && !ex.d) return 'del';
    if(!it.d && ex.d){ bump(it.n); return 'add'; }
    if(it.s && !ex.s) return 'strike';
    if(!it.s && ex.s) return 'add';
    return 'edit';
  }
  return null;
}

/* ===== المزامنة عبر ntfy ===== */
let es = null, online = false, connectAt = 0, lastSnap = 0, dirty = false;
function connect(){
  if(es){ es.close(); es = null; }
  const since = S.last ? Math.max(S.last - 5, Math.floor(Date.now()/1000) - 12*3600) : '12h';
  connectAt = Date.now()/1000;
  es = new EventSource(`${SERVER}/${CHANNEL}/sse?since=${since}`);
  es.onopen = () => { setOnline(true); sendSnapshot(); };
  es.onmessage = e => {
    let m; try{ m = JSON.parse(e.data); }catch(_){ return; }
    if(m.event !== 'message') return;
    if(m.time > S.last) S.last = m.time;
    let p; try{ p = JSON.parse(m.message); }catch(_){ save(); return; }
    if(!p || p.dev === S.dev) { save(); return; }
    const live = m.time >= connectAt - 3;
    let kinds = [];
    if(p.k === 'op' && p.it) { const r = apply(p.it); if(r) kinds.push({r, it:p.it}); }
    if(p.k === 'snap' && Array.isArray(p.its)) for(const it of p.its){ const r = apply(it); if(r) kinds.push({r,it}); }
    if(kinds.length){ save(); render(kinds.filter(k=>k.r==='add').map(k=>k.it.id)); if(live) alertFor(kinds); }
    else save();
  };
  es.onerror = () => { setOnline(false); es.close(); es = null; setTimeout(()=>{ if(!es) connect(); }, 3000); };
}
function setOnline(v){ online = v; document.getElementById('dot').classList.toggle('on', v); }

async function publish(obj){
  try{
    const r = await fetch(`${SERVER}/${CHANNEL}`, {method:'POST', body: JSON.stringify(obj)});
    if(!r.ok) throw 0;
  }catch(e){ dirty = true; }
}
function sendOp(it){ publish({v:VERSION, k:'op', dev:S.dev, it}); }
function sendSnapshot(force){
  if(!force && !dirty && Date.now() - lastSnap < 20000) return;
  lastSnap = Date.now(); dirty = false;
  let its = Object.values(S.items).sort((a,b)=> b.t - a.t);
  let body = {v:VERSION, k:'snap', dev:S.dev, its};
  while(new Blob([JSON.stringify(body)]).size > 3800 && its.length){
    // احذف أقدم المحذوفات أولاً ثم أقدم المشطوبات
    let i = findLastIdx(its, x=>x.d); if(i<0) i = findLastIdx(its, x=>x.s); if(i<0) i = its.length-1;
    its.splice(i,1);
  }
  publish(body);
}
function findLastIdx(a,f){ for(let i=a.length-1;i>=0;i--) if(f(a[i])) return i; return -1; }

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){ if(!es || es.readyState === 2) connect(); else sendSnapshot(); }
});
window.addEventListener('online', () => connect());

/* ===== النغمات ===== */
let ac = null;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); return ac; }
document.addEventListener('pointerdown', audio, {once:false, passive:true});
function tone(notes){
  const a = audio(); if(!a) return;
  let t = a.currentTime + 0.02;
  for(const [f,d] of notes){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+0.05);
    t += d*0.75;
  }
}
const SND_ADD = [[784,.16],[1047,.16],[1319,.28]];   // نغمة الإضافة: صاعدة
const SND_BUY = [[880,.14],[659,.26]];              // نغمة الشطب: هابطة ناعمة
function alertFor(kinds){
  const add = kinds.find(k=>k.r==='add'), buy = kinds.find(k=>k.r==='strike');
  if(add){ tone(SND_ADD); vibrate([60,40,60]); notify('أُضيف: ' + add.it.n, add.it.a ? 'من ' + add.it.a : ''); }
  else if(buy){ tone(SND_BUY); vibrate(40); notify('تم شراء: ' + buy.it.n, buy.it.b ? 'اشتراه ' + buy.it.b : ''); }
}
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
async function notify(title, body){
  if(document.visibilityState === 'visible') return;
  try{
    if(Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    reg.showNotification(title, {body, icon:'icon-192.png', badge:'icon-192.png', tag:'maqadi', renotify:true});
  }catch(e){}
}

/* ===== الأفعال ===== */
function activeByName(k){ return Object.values(S.items).find(it=>!it.d && norm(it.n)===k); }
function addItem(name){
  name = name.replace(/\s+/g,' ').trim(); if(!name) return;
  const k = norm(name);
  const ex = activeByName(k);
  if(ex && !ex.s){ flash(ex.id); return; }
  let it;
  if(ex && ex.s) it = {...ex, n:name, s:0, b:'', a:S.me, t:Date.now()};
  else it = {id: rid(7), n:name, s:0, d:0, a:S.me, b:'', t:Date.now()};
  bump(name);
  S.items[it.id] = it; save(); render([it.id]); sendOp(it);
}
function toggle(id){
  const ex = S.items[id]; if(!ex) return;
  const it = {...ex, s: ex.s?0:1, b: ex.s ? '' : S.me, t: Date.now()};
  S.items[id] = it; save(); render(); sendOp(it);
  vibrate(15);
}
function del(id, silent){
  const ex = S.items[id]; if(!ex) return;
  const it = {...ex, d:1, t:Date.now()};
  S.items[id] = it; save(); render(); sendOp(it);
  if(!silent) toast('حُذف «'+ex.n+'»', () => restore([ex]));
}
function clearDone(){
  const done = Object.values(S.items).filter(it=>!it.d && it.s);
  if(!done.length) return;
  const now = Date.now();
  for(const ex of done) S.items[ex.id] = {...ex, d:1, t:now};
  save(); render(); sendSnapshot(true);
  toast('مُسح ' + done.length + ' من المشطوب', () => restore(done));
}
function restore(list){
  const now = Date.now();
  for(const ex of list) S.items[ex.id] = {...ex, d:0, t:now};
  save(); render(); sendSnapshot(true);
}

/* ===== العرض ===== */
const $ = id => document.getElementById(id);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ago(t){
  const m = Math.round((Date.now()-t)/60000);
  if(m < 1) return 'الآن'; if(m < 60) return 'قبل ' + m + ' د';
  const h = Math.round(m/60); if(h < 24) return 'قبل ' + h + ' س';
  const d = Math.round(h/24); return d === 1 ? 'أمس' : 'قبل ' + d + ' أيام';
}
function row(it, isNew){
  const meta = it.s ? (it.b ? 'اشتراه ' + esc(it.b) : 'تم شراؤه') + ' · ' + ago(it.t)
                    : (it.a ? 'أضافه ' + esc(it.a) + ' · ' : '') + ago(it.t);
  return `<div class="item ${it.s?'done':''} ${isNew?'new':''}" data-id="${it.id}">
    <div class="box">${CHECK}</div>
    <div class="txt"><div class="name">${esc(it.n)}</div><div class="meta">${meta}</div></div>
    <button class="x" data-del="${it.id}" aria-label="حذف">×</button></div>`;
}
function render(newIds){
  newIds = newIds || [];
  const all = Object.values(S.items).filter(it=>!it.d);
  const act = all.filter(it=>!it.s).sort((a,b)=>b.t-a.t);
  const done = all.filter(it=>it.s).sort((a,b)=>b.t-a.t);
  $('active').innerHTML = act.length ? act.map(it=>row(it, newIds.includes(it.id))).join('')
    : `<div class="empty"><b>🛒</b>القائمة فارغة<br>اكتب ما تحتاجه فيظهر عند الجميع فوراً</div>`;
  $('doneWrap').innerHTML = done.length ? `<div class="sec">تم شراؤه (${done.length})<div class="sp"></div><button class="clear" id="clearBtn">مسح المشطوب</button></div>`
    + done.map(it=>row(it)).join('') : '';
  suggest();
}
function flash(id){
  const el = document.querySelector(`[data-id="${id}"]`);
  if(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
  toast('موجود في القائمة');
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-del]'); if(d){ e.stopPropagation(); del(d.dataset.del); return; }
  if(e.target.id === 'clearBtn'){ clearDone(); return; }
  const r = e.target.closest('.item'); if(r) toggle(r.dataset.id);
});

/* الاقتراحات: من أول حرف، الأكثر تكراراً فقط */
function suggest(){
  const q = norm($('inp').value);
  const box = $('sugg');
  if(!q){ box.innerHTML = ''; return; }
  const act = new Set(Object.values(S.items).filter(it=>!it.d && !it.s).map(it=>norm(it.n)));
  const list = Object.entries(S.counts)
    .filter(([k,v]) => v.c >= MIN_REPEAT && k.startsWith(q) && k !== q && !act.has(k))
    .sort((a,b) => b[1].c - a[1].c).slice(0, MAX_SUGG);
  box.innerHTML = list.map(([k,v]) => `<button type="button" class="chip" data-s="${esc(v.n)}">${esc(v.n)}</button>`).join('');
}
$('inp').addEventListener('input', suggest);
$('sugg').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  addItem(c.dataset.s); $('inp').value = ''; suggest(); $('inp').focus();
});
$('addForm').addEventListener('submit', e => {
  e.preventDefault(); addItem($('inp').value); $('inp').value = ''; suggest(); $('inp').focus();
});

/* رسالة صغيرة مع تراجع */
let toastTimer = null, toastUndo = null;
function toast(txt, undo){
  $('toastTxt').textContent = txt; toastUndo = undo || null;
  $('toastBtn').style.display = undo ? '' : 'none';
  $('toast').classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), undo ? 5000 : 1800);
}
$('toastBtn').onclick = () => { if(toastUndo) toastUndo(); toastUndo = null; $('toast').classList.remove('show'); };

/* الاسم */
function showName(){ $('whoName').textContent = S.me || 'اسمك'; }
function askName(){ $('nameInp').value = S.me; $('nameSheet').classList.add('show'); setTimeout(()=>$('nameInp').focus(), 100); }
$('whoBtn').onclick = askName;
$('nameSave').onclick = () => {
  const v = $('nameInp').value.trim(); if(!v){ $('nameInp').focus(); return; }
  S.me = v; save(); showName(); $('nameSheet').classList.remove('show'); audio();
  try{ if('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }catch(e){}
};
$('nameInp').addEventListener('keydown', e => { if(e.key === 'Enter') $('nameSave').click(); });

/* التثبيت */
let deferred = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('installBtn').style.display = 'block'; });
$('installBtn').onclick = async () => { if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('installBtn').style.display = 'none'; };
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) $('iosHint').style.display = 'block';
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
